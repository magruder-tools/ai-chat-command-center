name: Observer bug
description: Report an incorrect Working, Ready, or Unknown state using synthetic details only.
title: "[Observer] "
labels: [observer]
body:
  - type: markdown
    attributes:
      value: |
        Do not include prompts, answers, real conversation titles or URLs, screenshots from an authenticated account, cookies, tokens, credentials, or client information.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - ChatGPT
        - Claude
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Chrome version and extension version.
    validations:
      required: true
  - type: dropdown
    id: expected
    attributes:
      label: Expected status
      options:
        - Working
        - Ready
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: actual
    attributes:
      label: Actual status
      options:
        - Working
        - Ready
        - Unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Describe the UI state without including real account or conversation data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all conversation content, account data, credentials, client information, and private URLs.
          required: true
